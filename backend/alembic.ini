# alembic.ini
# ─────────────────────────────────────────────────────────────────────────────
# Alembic configuration file.
# The `sqlalchemy.url` value is intentionally left as a placeholder.
# The real URL is injected at runtime from the DATABASE_URL environment
# variable inside alembic/env.py — no credentials live in this file.
# ─────────────────────────────────────────────────────────────────────────────

[alembic]
# Path to migration scripts
script_location = alembic

# Placeholder — overridden in env.py from $DATABASE_URL
sqlalchemy.url = sqlite+aiosqlite:///./disaster.db

# Template for generated migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for file_template timestamps
timezone = UTC

[post_write_hooks]
# No post-write hooks configured

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
