<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Disaster & Emergency Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Minimal custom styles for subtle transitions */
        .card-transition {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-transition:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        /* Hide scrollbar for clean feed look */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-800 tracking-tight">Smart Disaster & Emergency Management Platform</h1>
                <p class="text-sm text-slate-500 font-medium">Emergency Control Room</p>
            </div>
            
            <div class="flex items-center gap-4">
                <!-- Status Indicator -->
                <div id="backend-status" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200 text-xs font-semibold text-slate-500 transition-colors duration-300">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-slate-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-slate-400"></span>
                    </span>
                    Checking Status...
                </div>

                <!-- Refresh Button -->
                <button id="refresh-btn" class="flex items-center gap-2 bg-white hover:bg-slate-50 text-slate-700 text-sm font-medium py-1.5 px-3 border border-slate-300 rounded shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-1">
                    <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                    Refresh
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 flex flex-col lg:flex-row gap-8">
        
        <!-- Left Column: Report Form -->
        <section class="w-full lg:w-1/3 flex-shrink-0">
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden sticky top-28">
                <div class="bg-slate-50 border-b border-slate-100 px-6 py-4">
                    <h2 class="text-lg font-semibold text-slate-800">Report Incident</h2>
                </div>
                
                <form id="incident-form" class="p-6 flex flex-col gap-5">
                    <!-- Title -->
                    <div>
                        <label for="title" class="block text-sm font-medium text-slate-700 mb-1">Title</label>
                        <input type="text" id="title" name="title" required minlength="3" maxlength="255" placeholder="e.g. Building fire on Main St" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                    </div>

                    <!-- Category -->
                    <div>
                        <label for="category" class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                        <select id="category" name="category" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                            <option value="" disabled selected>Select category...</option>
                            <option value="Fire">Fire</option>
                            <option value="Flood">Flood</option>
                            <option value="Medical">Medical</option>
                            <option value="Accident">Accident</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Coordinates -->
                    <div class="flex gap-4">
                        <div class="w-1/2">
                            <label for="latitude" class="block text-sm font-medium text-slate-700 mb-1">Latitude</label>
                            <input type="number" step="any" id="latitude" name="latitude" required min="-90" max="90" placeholder="34.0522" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                        </div>
                        <div class="w-1/2">
                            <label for="longitude" class="block text-sm font-medium text-slate-700 mb-1">Longitude</label>
                            <input type="number" step="any" id="longitude" name="longitude" required min="-180" max="180" placeholder="-118.2437" class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
                        </div>
                    </div>

                    <!-- Description -->
                    <div>
                        <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                        <textarea id="description" name="description" rows="4" required minlength="10" placeholder="Detailed description of the emergency..." class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors resize-none"></textarea>
                    </div>

                    <!-- Form Error Display -->
                    <div id="form-error" class="hidden rounded-md bg-red-50 p-3 text-sm text-red-600 border border-red-200">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="submit-btn" class="mt-2 w-full flex justify-center py-2.5 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-800 hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-colors disabled:opacity-70 disabled:cursor-not-allowed">
                        <span>Report Incident</span>
                    </button>
                </form>
            </div>
        </section>

        <!-- Right Column: Dashboard & Feed -->
        <section class="w-full lg:w-2/3 flex flex-col gap-6">
            
            <!-- Dashboard Summary -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-wrap gap-4 sm:gap-8 justify-between items-center">
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total</span>
                    <span id="stat-total" class="text-2xl font-bold text-slate-800">-</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-red-500 uppercase tracking-wider">High Severity</span>
                    <span id="stat-high" class="text-2xl font-bold text-red-600">-</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-amber-500 uppercase tracking-wider">Medium</span>
                    <span id="stat-medium" class="text-2xl font-bold text-amber-600">-</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-xs font-semibold text-emerald-500 uppercase tracking-wider">Low</span>
                    <span id="stat-low" class="text-2xl font-bold text-emerald-600">-</span>
                </div>
                <div class="flex flex-col pl-4 sm:pl-8 border-l border-slate-200">
                    <span class="text-xs font-semibold text-indigo-500 uppercase tracking-wider">Duplicates</span>
                    <span id="stat-dup" class="text-2xl font-bold text-indigo-600">-</span>
                </div>
            </div>

            <!-- Feed Container -->
            <div class="flex flex-col flex-grow">
                <h2 class="text-lg font-semibold text-slate-800 mb-4 px-1">Live Incident Feed</h2>
                
                <!-- System Messages (Loading/Error) -->
                <div id="feed-status" class="bg-white rounded-xl border border-slate-200 p-8 text-center text-slate-500 shadow-sm">
                    <div class="animate-pulse flex flex-col items-center">
                        <div class="h-8 w-8 rounded-full border-4 border-slate-200 border-t-slate-500 animate-spin mb-4"></div>
                        <p>Loading incidents...</p>
                    </div>
                </div>

                <!-- Incident List -->
                <div id="incident-feed" class="flex flex-col gap-4 hide-scrollbar">
                    <!-- Cards injected by JS -->
                </div>
            </div>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
